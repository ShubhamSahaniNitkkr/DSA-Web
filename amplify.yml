version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customRedirects:
        - source: '/api/<*>'
          target: 'http://35.77.118.221:5001/api/<*>'
          status: '200'
        - source: '/<*>'
          target: '/index.html'
          status: '200'
